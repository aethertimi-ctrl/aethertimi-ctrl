<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Aether Timi — Creative Developer</title>
  <desc id="desc">A dark abstract banner with electric violet and cyan gradients and the words Creative Developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b18"/>
      <stop offset="0.55" stop-color="#17102f"/>
      <stop offset="1" stop-color="#071b2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".48"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="970" cy="80" r="250" fill="url(#orb)"/>
  <circle cx="180" cy="320" r="210" fill="url(#orb)" opacity=".55"/>
  <path d="M0 250 C250 150 390 360 660 220 S1010 80 1200 150" fill="none" stroke="url(#glow)" stroke-opacity=".24" stroke-width="2"/>
  <path d="M0 270 C270 170 410 380 690 240 S1030 100 1200 170" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="112" font-size="22" letter-spacing="7" fill="#a5f3fc">AETHER TIMI</text>
    <text x="72" y="190" font-size="66" font-weight="700" letter-spacing="-2">Creative Developer</text>
    <text x="78" y="236" font-size="20" fill="#c4b5fd" letter-spacing="1">WEB EXPERIENCES  /  DIGITAL DESIGN  /  CREATIVE CODE</text>
  </g>
  <rect x="78" y="258" width="118" height="4" rx="2" fill="url(#glow)"/>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".45">
    <circle cx="1050" cy="205" r="46"/>
    <circle cx="1050" cy="205" r="68" stroke-opacity=".2"/>
    <path d="M1050 115v180M960 205h180" stroke-opacity=".2"/>
